name: Daily stats refresh + deploy
on:
  schedule:
    - cron: "53 11 * * *"
    - cron: "7 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow numpy
      - name: Retrieve historical lines
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download data -p lines_hist.json --clobber || echo "no line history yet"
      - name: Refresh sports statistics
        env:
          PB_WORK: ${{ runner.temp }}/work
        run: python build_data.py .
      - name: Retrieve licensed odds (optional)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_MAX_PROP_EVENTS: "4"
        run: python fetch_odds.py .
      - run: test $(stat -c%s data.json) -gt 2000000
      - name: Save release data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data >/dev/null 2>&1 || gh release create data --title "Latest data" --notes "Play Haus data refresh"
          gh release upload data $(ls data.json slate.json data_cbb.json data_wnba.json lines_hist.json odds_snapshot.json 2>/dev/null) --clobber
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
